name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Rebuild daily so GitHub stats, PR status and Dev.to articles stay fresh
  # even for visitors whose browsers block the live refresh.
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

# Nothing by default; each job asks only for what it needs.
permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      # Third-party actions are pinned to full commit SHAs (tag in the
      # comment) so a moved or hijacked tag cannot change what runs here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      # Exact versions from the lockfile, without running package install scripts.
      - run: npm ci --ignore-scripts
      # Fail the deploy if a shipped dependency has a known high or critical issue.
      - name: Audit dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Build
        run: npm run build
        env:
          # Read-only token; lifts the GitHub API rate limit for build-time data.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
